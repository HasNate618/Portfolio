<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R3F Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #info {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      color: #0ff; font-family: monospace; font-size: 14px;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 4px;
      z-index: 10; white-space: pre;
    }
  </style>
</head>
<body>
  <div id="info">Loading...</div>
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
      "@react-three/fiber": "https://cdn.jsdelivr.net/npm/@react-three/fiber@9.3.0/dist/react-three-fiber.esm.js",
      "react": "https://cdn.jsdelivr.net/npm/react@19.0.0/+esm",
      "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@19.0.0/+esm",
      "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.0.0/client.mjs",
      "scheduler": "https://cdn.jsdelivr.net/npm/scheduler@0.25.0/+esm"
    }
  }
  </script>

  <script type="module">
    import React, { useRef, useEffect, useMemo } from 'react';
    import ReactDOM from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import * as THREE from 'three';

    const info = document.getElementById('info');

    function Model({ url }) {
      const group = useRef();
      const mixerRef = useRef(null);
      const [loaded, setLoaded] = React.useState(false);

      useEffect(() => {
        const loader = new THREE.GLTFLoader();
        info.textContent = 'Loading model...';
        loader.load(url, (gltf) => {
          const scene = gltf.scene;
          const box = new THREE.Box3().setFromObject(scene);
          const center = box.getCenter(new THREE.Vector3());
          scene.position.sub(center);

          scene.traverse((child) => {
            if (child.isMesh) child.frustumCulled = false;
          });

          // Store for useFrame
          group.current.sceneData = scene;
          group.current.animations = gltf.animations;
          group.current.add(scene);

          if (gltf.animations.length > 0) {
            const mixer = new THREE.AnimationMixer(scene);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
            mixerRef.current = mixer;
            info.textContent = `Loaded: ${gltf.animations.length} anims | Playing: ${gltf.animations[0].name}`;

            // click to cycle
            window.cycleAnim = () => {
              const anims = gltf.animations;
              const currentIdx = anims.indexOf(action.getClip());
              const nextIdx = (currentIdx + 1) % anims.length;
              action.stop();
              const newAction = mixer.clipAction(anims[nextIdx]);
              newAction.reset().play();
              info.textContent = `Loaded: ${anims.length} anims | Playing: ${anims[nextIdx].name}`;
            };
          } else {
            info.textContent = 'Loaded: no animations';
          }
          setLoaded(true);
        });
        return () => {
          if (mixerRef.current) mixerRef.current.stopAllAction();
        };
      }, [url]);

      useFrame((state, delta) => {
        if (mixerRef.current) mixerRef.current.update(delta);
      });

      const handleClick = () => {
        if (window.cycleAnim) window.cycleAnim();
      };

      return (
        <group ref={group} onClick={handleClick}>
          {/* scene is added dynamically */}
        </group>
      );
    }

    function Scene() {
      return (
        <>
          <ambientLight intensity={0.6} />
          <directionalLight position={[5, 5, 5]} intensity={1} />
          <directionalLight position={[-3, 3, -2]} intensity={0.8} />
          <pointLight position={[2, 3, 2]} intensity={0.5} />
          <pointLight position={[-2, 1, 3]} intensity={0.3} />
          <Model url="/models/model.glb" />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <div style={{ width: '100vw', height: '100vh' }}>
        <Canvas
          camera={{ position: [0, 0, 5], fov: 45 }}
          style={{ background: 'transparent' }}
          shadows
          gl={{ alpha: true, antialias: true }}
        >
          <Scene />
        </Canvas>
      </div>
    );

    info.textContent = 'React mounted, loading model...';
  </script>
</body>
</html>
